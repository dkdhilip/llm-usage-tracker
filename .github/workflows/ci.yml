name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: llm
          POSTGRES_PASSWORD: llm
          POSTGRES_DB: llmtracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U llm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://llm:llm@localhost:5432/llmtracker_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Provider SDKs for tests/test_sdk_integrations.py and tests/test_openai_sdk_drop_in.py, which skip
      # silently without them. Pinned to the versions those tests were verified against; keep in sync
      # with examples/gateway-sdks/requirements.txt.
      - run: pip install "openai==3.29.0" "anthropic==1.13.0" "google-genai==2.30.0" "python-dotenv==1.2.3"
      - run: ruff check app tests
      - run: pytest -q
      # Client contract tests for examples/gateway-sdks: a local stand-in gateway, nothing leaves 127.0.0.1.
      - run: pytest -q ../examples/gateway-sdks/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-usage-tracker:ci .
